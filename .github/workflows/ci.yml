name: ci

on:
  pull_request:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check (lint, typecheck, coverage)
        run: npm run check

      - name: Test
        run: npm test

      - name: Contract tests (Tier A compatibility)
        run: npm test -- test/integration/compat-contract.test.ts

      - name: Contract fixtures are reproducible
        run: |
          npm run fixtures:contracts
          git diff --exit-code test/fixtures/contracts

      - name: Check trailing whitespace
        run: git diff --check
