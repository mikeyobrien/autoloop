event_loop.max_iterations = 100
event_loop.completion_event = "task.complete"
event_loop.completion_promise = "LOOP_COMPLETE"
event_loop.required_events = ["review.passed"]

# Default lane: pi on the rigor "judgment and prose" model. Planner and
# finalizer inherit this; every other role overrides harness and/or model
# in topology.toml.
backend.kind = "pi"
backend.command = "pi"
backend.args = []
backend.model = "openai-codex/gpt-6-sol"
backend.trust_all_tools = true
backend.timeout_ms = 3000000

review.enabled = true
review.every_iterations = 10
review.adversarial_first = false
review.timeout_ms = 300000

# First lane choice by Jev (needs TYPESAFE_API_KEY; sends the objective to
# TypeSafe). Low confidence falls back to the planner choosing; complexity
# at or above the threshold routes to the astra lane. Set enabled = false
# to have the planner choose every lane.
routing.jev.enabled = true
routing.jev.routes_file = "routes.json"
routing.jev.model = "jev-1.13.0"
routing.jev.min_confidence = 0.8
routing.jev.fallback_route = "unrouted"
routing.jev.complexity_route = "hard"
routing.jev.complexity_threshold = 1.5

memory.prompt_budget_chars = 8000
harness.instructions_file = "harness.md"

core.state_dir = ".autoloop"
core.journal_file = ".autoloop/journal.jsonl"
core.memory_file = ".autoloop/memory.jsonl"
